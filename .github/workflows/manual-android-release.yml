name: Manual Android release build

on:
  workflow_dispatch:
    inputs:
      confirm_release_build:
        description: "Set to true only when the dedicated Skillect release keystore secrets are ready"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

jobs:
  release:
    if: ${{ inputs.confirm_release_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore private release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 GitHub Actions secret."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/skillect-release.jks"
          test -s "$GITHUB_WORKSPACE/skillect-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/skillect-release.jks"

      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH: skillect-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for $name."
              exit 1
            fi
          done
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillect-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove restored keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/skillect-release.jks"
